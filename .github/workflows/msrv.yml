name: Rust 1.98 Compatibility

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      msrv:
        description: 'Rust toolchain to test against'
        required: false
        default: '1.98.0'

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: Check Rust 1.98
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install specified Rust version
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ github.event.inputs.msrv || '1.98.0' }}

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Check if project builds with selected Rust toolchain
      run: cargo check --all-targets --all-features

    - name: Run tests with selected Rust toolchain
      run: cargo test --all-features --lib

    - name: Verify Cargo.lock compatibility
      run: |
        # Check that the lockfile is reproducible with the selected toolchain.
        cargo update --locked

    - name: Generate MSRV report
      run: |
        echo "## Rust Toolchain Compatibility Report" > msrv_report.md
        echo "" >> msrv_report.md
        echo "**Tested Rust Version:** ${{ github.event.inputs.msrv || '1.98.0' }}" >> msrv_report.md
        echo "" >> msrv_report.md
        echo "### Build Status: ✅ PASSED" >> msrv_report.md
        echo "### Test Status: ✅ PASSED" >> msrv_report.md
        echo "" >> msrv_report.md
        echo "**Note:** The SDK is pinned to Rust ${{ github.event.inputs.msrv || '1.98.0' }}." >> msrv_report.md

    - name: Upload MSRV report
      uses: actions/upload-artifact@v4
      with:
        name: msrv-report
        path: msrv_report.md

  update-msrv:
    name: Report Rust Toolchain Badge
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs: msrv

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Update README with MSRV badge
      run: |
        MSRV="${{ github.event.inputs.msrv || '1.98.0' }}"
        # This would update a badge in README.md if it exists
        # For now, just output the badge URL
        echo "MSRV Badge URL: https://img.shields.io/badge/msrv-${MSRV//./_}-orange"
        echo "Update your README.md with this badge to show MSRV compatibility"
