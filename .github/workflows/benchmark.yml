name: Performance Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: SDK Microbenchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tracked benchmarks
        run: cargo bench --bench client_benchmark

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: criterion-results
          path: target/criterion/
          retention-days: 30

  build-and-size:
    name: Release Build and Size
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build balanced release profile
        run: /usr/bin/time -p -o release-build-time.txt cargo build --release --all-features --timings

      - name: Build maximum-performance profile
        run: /usr/bin/time -p -o release-perf-build-time.txt cargo build --profile release-perf --all-features

      - name: Record library sizes and build timings
        run: |
          {
            echo "## Rainy SDK release artifacts"
            echo
            for artifact in target/release/librainy_sdk.rlib target/release-perf/librainy_sdk.rlib; do
              if [ -f "$artifact" ]; then
                stat -c '%n %s bytes' "$artifact"
              fi
            done
            echo
            echo "Wall-clock release build timing:"
            cat release-build-time.txt
            cat release-perf-build-time.txt
            echo
            echo "Cargo build timing reports:"
            find target/cargo-timings -maxdepth 1 -type f -name '*.html' -print
          } | tee build-size-report.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-build-reports
          path: |
            build-size-report.txt
            release-build-time.txt
            release-perf-build-time.txt
            target/cargo-timings/
          retention-days: 30
